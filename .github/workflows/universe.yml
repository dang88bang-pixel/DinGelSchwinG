name: Universe Check

# Schritt 1 (Inventar) und Schritt 5 (Testen) der Auftragsbeschreibung
# .github/agents/universal-engineer.md — projektagnostisch, läuft bei jedem Push/PR.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: universe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Inventar (Schritt 1)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Audit-Skript ausführen
        run: bash scripts/universe_audit.sh

      - name: Bericht prüfen
        run: |
          test -s reports/inventory.md
          echo "Zeilen: $(wc -l < reports/inventory.md)"
          echo "Markiert: $(grep -cE 'MOCK|TODO|STUB|FIXME|PLACEHOLDER' reports/inventory.md || true)"

      - name: Bericht als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: inventory
          path: reports/inventory.md
          retention-days: 30

  test:
    name: Test-Harness (Schritt 5)
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren (Node)
        run: npm ci --no-audit --no-fund

      - name: Python-Abhängigkeiten installieren (fail-soft)
        # Nur so weit wie möglich: fehlende Pakete meldet der Harness als ⚠️, nicht als ❌.
        run: |
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet pytest || true
          python3 -m pip install --quiet -r server/requirements.txt || true
          python3 -m pip install --quiet -r genesis-orchestrator/fastapi-backend/requirements.txt || true

      - name: Test-Harness ausführen
        env:
          # Informative Health-Probes (offline ⇒ ⏭, kein Fehlschlag ohne --require-health)
          UNIVERSE_HEALTH_PORTS: "5000,5173,8790,8791,8080-8085"
        # --with-build erzeugt zusätzlich das Frontend-Artefakt (dist/) — Schritt 5.
        run: python3 tests/universe_harness.py --with-build --json reports/harness.json

      # Die Suiten des Repos selbst — je Suite ein eigener Schritt (Fehlerzuordnung
      # ohne Log-Download) und ohne Zusatzdienste lauffähig.
      - name: Server-Tests (unittest)
        run: python3 -m unittest discover -s server/tests -v

      - name: Gateway-Tests (mobile-server)
        run: |
          # Fehlgeschlagene Einzeltests als Annotation ausgeben (sichtbar auch ohne Log-Download).
          set +e
          output=$(python3 mobile-server/tests/test_gateway.py 2>&1)
          status=$?
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -E "❌" | while IFS= read -r line; do
            echo "::error title=Gateway-Test fehlgeschlagen::$line"
          done
          exit $status

      - name: Desktop-Tests
        run: python3 desktop/tests/test_core.py

      - name: Ergebnis als Artefakt hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universe-harness
          path: reports/harness.json
          if-no-files-found: ignore
          retention-days: 30
