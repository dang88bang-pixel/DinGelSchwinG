name: Build APK

# Baut das installierbare APK für Android 11–16 (API 30–36).
# Auslöser: Push auf main, Pull Request, Tag v* (→ GitHub Release) und manuell.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      artifact_suffix:
        description: 'Namenszusatz für das Artefakt (optional)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build & Release APK (Android 11–16)
    runs-on: ubuntu-latest
    env:
      ANDROID_COMPILE_SDK: '36'
      ANDROID_TARGET_SDK: '36'
      ANDROID_MIN_SDK: '30'
      ANDROID_BUILD_TOOLS: '36.0.0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Capacitor 8 / AGP 8.13 bauen mit JDK 21 (die Module erzwingen VERSION_21).
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform ${{ env.ANDROID_COMPILE_SDK }} and build-tools ${{ env.ANDROID_BUILD_TOOLS }}
        run: |
          sdkmanager --install "platforms;android-${ANDROID_COMPILE_SDK}" \
                     "build-tools;${ANDROID_BUILD_TOOLS}" "platform-tools"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      # BLE-Distanz-WASM (wasm-ble/ → public/wasm/): baut das Rust-Modul mit
      # wasm-pack, damit die App echtes WASM statt des JS-Fallbacks lädt
      # (src/lib/bleWasm.ts erkennt beides; Fail-soft wie bei adb/fastboot).
      - name: Build BLE WASM (wasm-ble)
        run: |
          set -u
          if ! command -v rustc >/dev/null; then
            echo "→ Installiere Rust-Toolchain (minimal)"
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable || echo "::warning::Rust-Installation fehlgeschlagen – JS-Fallback bleibt aktiv"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          if command -v cargo >/dev/null || [ -x "$HOME/.cargo/bin/cargo" ]; then
            export PATH="$HOME/.cargo/bin:$PATH"
            rustup target add wasm32-unknown-unknown || true
            if ! command -v wasm-pack >/dev/null; then
              WPACK_VER="v0.13.1"
              curl -sSfL "https://github.com/rustwasm/wasm-pack/releases/download/${WPACK_VER}/wasm-pack-${WPACK_VER}-x86_64-unknown-linux-musl.tar.gz" -o /tmp/wasm-pack.tgz \
                && tar -xzf /tmp/wasm-pack.tgz -C /tmp \
                && sudo install -m 755 "/tmp/wasm-pack-${WPACK_VER}-x86_64-unknown-linux-musl/wasm-pack" /usr/local/bin/wasm-pack \
                || echo "::warning::wasm-pack nicht installierbar – JS-Fallback bleibt aktiv"
            fi
            if command -v wasm-pack >/dev/null; then
              (cd wasm-ble && wasm-pack build --target web --out-dir ../public/wasm) \
                && echo "✅ WASM gebaut: $(ls -la public/wasm/ | grep -E 'wasm|js')" \
                || echo "::warning::wasm-pack-Build fehlgeschlagen – JS-Fallback bleibt aktiv"
            fi
          else
            echo "::warning::Keine Rust-Toolchain – JS-Fallback bleibt aktiv"
          fi

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor
        run: |
          npx cap sync android
          npx cap doctor || true

      - name: Prepare release keystore (if secrets provided)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            echo "KEYSTORE_PATH=release.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "-> Keystore konfiguriert (Release wird signiert)"
          else
            echo "-> Kein Keystore-Secret gesetzt – Release-APK wird mit Debug-Schlüssel signiert."
          fi

      - name: Set app version from tag (if any)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # Device-Control-Subsystem: echte ARM64-Binaries von adb/fastboot holen
      # (offizielles Termux-Paket android-tools, Apache-2.0, mit SHA-256-Check).
      # Fail-soft: Scheitert der Download, bleibt es beim ELF-Platzhalter und
      # die App meldet später eine klare Handlungsanweisung statt abzustürzen.
      - name: Fetch Device-Control binaries (adb/fastboot, ARM64)
        run: |
          bash scripts/fetch-android-tools.sh || echo "::warning::ADB/Fastboot-Binaries nicht geladen – APK enthält Platzhalter"
          for b in adb fastboot; do
            f="android/app/src/main/assets/devicecontrol/$b"
            if head -c 4 "$f" | od -An -tx1 | tr -d ' \n' | grep -q '^7f454c46'; then
              echo "✅ $b: echtes ELF-Binary ($(du -h "$f" | cut -f1))"
            else
              echo "⚠️ $b: Platzhalter"
            fi
          done

      # Bei einem Fehlschlag landet das Ende des Gradle-Logs im Step-Summary,
      # damit der Fehler auch ohne Log-Download lesbar bleibt (Check-Run-API).
      - name: Build Debug APK
        run: |
          set -o pipefail
          cd android
          if ! ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle-build.log; then
            {
              echo "## ❌ Gradle-Fehler: assembleDebug"
              echo '```'
              grep -E "FAILURE|What went wrong|Caused by|error:|e: |Could not|Unsupported|requires" -A 2 /tmp/gradle-build.log | tail -c 12000
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # Zusaetzlich als Annotation (ueber die Check-Run-API lesbar,
            # auch wenn der Log-Download nicht erreichbar ist)
            grep -E "^e: |FAILURE: |\* What went wrong|\* Where|Caused by:|error:" /tmp/gradle-build.log \
              | sort -u | head -8 \
              | while IFS= read -r line; do
                  echo "::error::[assembleDebug] ${line}"
                done
            echo "::error::[assembleDebug] Log-Tail: $(tail -c 900 /tmp/gradle-build.log | tr '\n' ' ')"
            exit 1
          fi

      - name: Build Release APK
        run: |
          set -o pipefail
          cd android
          if ! ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/gradle-build.log; then
            {
              echo "## ❌ Gradle-Fehler: assembleRelease"
              echo '```'
              grep -E "FAILURE|What went wrong|Caused by|error:|e: |Could not|Unsupported|requires" -A 2 /tmp/gradle-build.log | tail -c 12000
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # Zusaetzlich als Annotation (ueber die Check-Run-API lesbar,
            # auch wenn der Log-Download nicht erreichbar ist)
            grep -E "^e: |FAILURE: |\* What went wrong|\* Where|Caused by:|error:" /tmp/gradle-build.log \
              | sort -u | head -8 \
              | while IFS= read -r line; do
                  echo "::error::[assembleRelease] ${line}"
                done
            echo "::error::[assembleRelease] Log-Tail: $(tail -c 900 /tmp/gradle-build.log | tr '\n' ' ')"
            exit 1
          fi

      - name: Collect APKs
        run: |
          mkdir -p apk
          VERSION="$(node -p "require('./package.json').version")"
          SUFFIX="${{ github.event.inputs.artifact_suffix }}"
          [ -n "$SUFFIX" ] && SUFFIX="-$SUFFIX"
          cp android/app/build/outputs/apk/debug/app-debug.apk "apk/DinGelSchwinG-v${VERSION}${SUFFIX}-debug.apk"
          rm -f android/app/build/outputs/apk/release/app-release-unsigned.apk
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "apk/DinGelSchwinG-v${VERSION}${SUFFIX}-release.apk"
          fi
          ( cd apk && sha256sum *.apk > SHA256SUMS )
          ls -lh apk/
          cat apk/SHA256SUMS

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DinGelSchwinG-APK
          path: |
            apk/*.apk
            apk/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      # Aufnahmeprüfung: die APKs müssen exakt Android 11 (API 30) bis Android 16 (API 36)
      # abdecken. Sie läuft NACH dem Artefakt-Upload, damit ein Fund auch bei abweichender
      # Prüfung herunterladbar bleibt – der Job bricht trotzdem ab (rotes X).
      - name: Verify APK SDK range (min 30 / target 36)
        run: |
          set +e
          AAPT2=""
          for c in "$ANDROID_HOME"/build-tools/*/aapt2 "$ANDROID_SDK_ROOT"/build-tools/*/aapt2 "$(command -v aapt2)"; do
            [ -x "$c" ] && AAPT2="$c" && break
          done
          echo "aapt2: ${AAPT2:-NICHT GEFUNDEN}  (ANDROID_HOME=${ANDROID_HOME:-unset})"
          ls "$ANDROID_HOME/build-tools" 2>/dev/null
          FAIL=0
          for apk in android/app/build/outputs/apk/*/*.apk; do
            [ -f "$apk" ] || continue
            echo "══════════ $apk"
            BADGE="$( "$AAPT2" dump badging "$apk" 2>&1 )"
            echo "$BADGE" | head -30
            [ -z "$BADGE" ] && { echo "❌ aapt2 lieferte keine Ausgabe"; FAIL=1; continue; }
            MIN="$(  echo "$BADGE" | sed -n "s/^sdkVersion:'\{0,1\}\([0-9]\{1,3\}\)'\{0,1\}.*/\1/p" | head -1 )"
            TGT="$(  echo "$BADGE" | sed -n "s/^targetSdkVersion:'\{0,1\}\([0-9]\{1,3\}\)'\{0,1\}.*/\1/p" | head -1 )"
            [ -z "$MIN" ] && MIN="$(echo "$BADGE" | sed -n "s/^minSdkVersion=\{0,1\}'\{0,1\}\([0-9]\{1,3\}\).*/\1/p" | head -1)"
            [ -z "$TGT" ] && TGT="$(echo "$BADGE" | sed -n "s/^targetSdkVersion=\{0,1\}'\{0,1\}\([0-9]\{1,3\}\).*/\1/p" | head -1)"
            echo "extrahiert: minSdk=[${MIN}] targetSdk=[${TGT}]"
            [ "$MIN" = "${ANDROID_MIN_SDK}" ]   || { echo "❌ minSdk ist nicht ${ANDROID_MIN_SDK} (Android 11)"; FAIL=1; }
            [ "$TGT" = "${ANDROID_TARGET_SDK}" ] || { echo "❌ targetSdk ist nicht ${ANDROID_TARGET_SDK} (Android 16)"; FAIL=1; }
            echo "$BADGE" | grep -q "BLUETOOTH_SCAN" || { echo "❌ BLE-Permissions fehlen"; FAIL=1; }
            # Device-Control: Assets müssen gebündelt sein (Binaries oder Platzhalter,
            # ROM-/Hersteller-/Befehls-Datenbanken)
            ASSETS="$(unzip -l "$apk" | grep -c 'assets/devicecontrol/')"
            if [ "$ASSETS" -ge 6 ]; then
              echo "✅ Device-Control-Assets gebündelt ($ASSETS Einträge)"
            else
              echo "❌ Device-Control-Assets fehlen ($ASSETS < 6)"; FAIL=1
            fi
            echo "$BADGE" | grep -q "^package: name='com.dingelschwinng.moeagent'" || echo "ℹ️ Paketname wie folgt: $(echo "$BADGE" | grep -m1 '^package:')"
            echo "Größe: $(du -h "$apk" | cut -f1)"
          done
          if [ "$FAIL" = "0" ]; then
            echo "✅ SDK-Bereich 30…36 und BLE-Permissions passen"
          else
            echo "❌ APK-Prüfung fehlgeschlagen – Ausgabe oben"
            exit 1
          fi

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apk/*.apk
            apk/SHA256SUMS
          body: |
            DinGelSchwinG – Android 11 (API 30) bis Android 16 (API 36).
            Das Debug-APK ist sideload-fähig; das Release-APK ist mit dem
            Keystore-Secret signiert (falls konfiguriert).
            Prüfung: minSdk/targetSdk werden im Build gegen `aapt2 dump badging` verifiziert.
            Enthält das Device-Control-Subsystem (ADB/Fastboot-Steuerzentrale,
            automatische Port-View, ROM-Flashing mit Brick-Schutz – Details in
            docs/device-control.md).
          generate_release_notes: true
