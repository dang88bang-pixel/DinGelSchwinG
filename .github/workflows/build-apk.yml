name: Build APK

# Baut das installierbare APK für Android 11–16 (API 30–36).
# Auslöser: Push auf main, Pull Request, Tag v* (→ GitHub Release) und manuell.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      artifact_suffix:
        description: 'Namenszusatz für das Artefakt (optional)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build & Release APK (Android 11–16)
    runs-on: ubuntu-latest
    env:
      ANDROID_COMPILE_SDK: '36'
      ANDROID_TARGET_SDK: '36'
      ANDROID_MIN_SDK: '30'
      ANDROID_BUILD_TOOLS: '36.0.0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Capacitor 8 / AGP 8.13 bauen mit JDK 21 (die Module erzwingen VERSION_21).
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform ${{ env.ANDROID_COMPILE_SDK }} and build-tools ${{ env.ANDROID_BUILD_TOOLS }}
        run: |
          sdkmanager --install "platforms;android-${ANDROID_COMPILE_SDK}" \
                     "build-tools;${ANDROID_BUILD_TOOLS}" "platform-tools"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor
        run: |
          npx cap sync android
          npx cap doctor || true

      - name: Prepare release keystore (if secrets provided)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            echo "KEYSTORE_PATH=release.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "-> Keystore konfiguriert (Release wird signiert)"
          else
            echo "-> Kein Keystore-Secret gesetzt – Release-APK wird mit Debug-Schlüssel signiert."
          fi

      - name: Set app version from tag (if any)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build Debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        run: cd android && ./gradlew assembleRelease --no-daemon --stacktrace

      # Harte Aufnahmeprüfung: das APK muss exakt Android 11 (API 30) bis
      # Android 16 (API 36) abdecken – sonst bricht der Build statt still
      # ein APK mit falschem SDK-Bereich zu liefern.
      - name: Verify APK SDK range (min 30 / target 36)
        run: |
          AAPT2="$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/aapt2"
          [ -x "$AAPT2" ] || AAPT2="$(command -v aapt2)"
          for apk in android/app/build/outputs/apk/*/*.apk; do
            [ -f "$apk" ] || continue
            echo "== $apk"
            "$AAPT2" dump badging "$apk" | grep -E "^(package:|sdkVersion:|targetSdkVersion:|uses-permission)" || true
            BADGE="$("$AAPT2" dump badging "$apk")"
            echo "$BADGE" | grep -q "sdkVersion:'${ANDROID_MIN_SDK}'" \
              || { echo "❌ minSdk ist nicht ${ANDROID_MIN_SDK} (Android 11)"; exit 1; }
            echo "$BADGE" | grep -q "targetSdkVersion:'${ANDROID_TARGET_SDK}'" \
              || { echo "❌ targetSdk ist nicht ${ANDROID_TARGET_SDK} (Android 16)"; exit 1; }
            echo "$BADGE" | grep -q "BLUETOOTH_SCAN" \
              || { echo "❌ BLE-Permissions fehlen in der App"; exit 1; }
            echo "✅ SDK-Bereich 30…36 passt"
          done

      - name: Collect APKs
        run: |
          mkdir -p apk
          VERSION="$(node -p "require('./package.json').version")"
          SUFFIX="${{ github.event.inputs.artifact_suffix }}"
          [ -n "$SUFFIX" ] && SUFFIX="-$SUFFIX"
          cp android/app/build/outputs/apk/debug/app-debug.apk "apk/DinGelSchwinG-v${VERSION}${SUFFIX}-debug.apk"
          rm -f android/app/build/outputs/apk/release/app-release-unsigned.apk
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "apk/DinGelSchwinG-v${VERSION}${SUFFIX}-release.apk"
          fi
          ( cd apk && sha256sum *.apk > SHA256SUMS )
          ls -lh apk/
          cat apk/SHA256SUMS

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DinGelSchwinG-APK
          path: |
            apk/*.apk
            apk/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apk/*.apk
            apk/SHA256SUMS
          body: |
            DinGelSchwinG – Android 11 (API 30) bis Android 16 (API 36).
            Das Debug-APK ist sideload-fähig; das Release-APK ist mit dem
            Keystore-Secret signiert (falls konfiguriert).
            Prüfung: minSdk/targetSdk werden im Build gegen `aapt2 dump badging` verifiziert.
          generate_release_notes: true
