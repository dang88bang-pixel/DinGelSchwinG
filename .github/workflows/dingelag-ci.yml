# DinGelAg V0.1 — Bau- und Prüfkette für den Inventur-App-Teil des Repos.
#
# Warum ein eigener Workflow? `build-apk.yml` baut die Capacitor-App des
# Hauptprojekts. DinGelAg ist Flutter und lebt in `dingelag/`; beide Ketten
# sollen unabhängig voneinander grün werden und sich nicht gegenseitig
# ausbremsen.
#
# Zwei Jobs:
#   referenz  — Python-Referenz + Paritätsprüfungen (läuft ohne Flutter-SDK,
#               also auch dann, wenn der App-Bau hakt)
#   app       — Flutter: Plattformen erzeugen, pub get, analyze, test,
#               APK (debug) und Web (release) bauen, Artefakte hochladen
name: DinGelAg CI

on:
  push:
    branches: [main, 'arena/**']
    paths:
      - 'dingelag/**'
      - '.github/workflows/dingelag-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'dingelag/**'
      - '.github/workflows/dingelag-ci.yml'
  workflow_dispatch:

# `contents: write` braucht nur der Fehlschlag-Kommentar am Commit (siehe
# „Befund am Commit melden"). Ohne dieses Recht läuft der Bau trotzdem.
permissions:
  contents: write

concurrency:
  group: dingelag-${{ github.ref }}
  cancel-in-progress: true

jobs:
  referenz:
    name: Referenz & Parität (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Repository holen
        uses: actions/checkout@v4

      - name: Python bereitstellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Schema-Spiegel ist aktuell
        shell: bash
        run: |
          set -euo pipefail
          python3 dingelag/reference/generate_schema_dart.py
          if ! git diff --exit-code -- dingelag/lib/data/schema.dart; then
            echo "::error::lib/data/schema.dart weicht von schema/schema.sql ab — Generator laufen lassen und einreichen."
            exit 1
          fi
          echo "Schema-Spiegel stimmt mit schema/schema.sql überein." >> "$GITHUB_STEP_SUMMARY"

      - name: Inventur-Kern und Parität prüfen
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s dingelag/reference/tests -v 2>&1 | tee reference.log
          tail -n 20 reference.log >> "$GITHUB_STEP_SUMMARY"

      - name: Ergebnis bei Fehlschlag zusammenfassen
        if: failure()
        shell: bash
        run: |
          {
            echo '## DinGelAg-Referenz fehlgeschlagen'
            echo '```'
            tail -n 60 reference.log 2>/dev/null || echo 'kein Protokoll vorhanden'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  app:
    name: Flutter (analyze, test, APK, Web)
    runs-on: ubuntu-latest
    needs: referenz
    # Grenze für den ganzen Job: Ohne sie läuft ein hängender Test bis zur
    # Vorgabe von GitHub (6 Stunden) und blockiert die Kette.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: dingelag
    steps:
      - name: Repository holen
        uses: actions/checkout@v4

      - name: Java 17 bereitstellen
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter bereitstellen
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.3'
          cache: true

      # Die Plattformverzeichnisse (android/, web/) liegen bewusst nicht im
      # Git: Sie sind erzeugbarer Ballast. `flutter create .` ergänzt sie
      # fehlertolerant, ohne `lib/` oder `pubspec.yaml` anzufassen.
      - name: Plattformen erzeugen (android, web)
        shell: bash
        run: |
          set -euo pipefail
          flutter config --no-analytics
          flutter create --platforms=android,web --org app.dingelag --project-name dingelag .
          # `flutter create` ergänzt fehlende Vorlagendateien und fasst
          # vorhandene nicht an: `lib/`, `pubspec.yaml` und `test/` bleiben
          # also, wie sie eingereicht wurden. Falls die Vorlage trotzdem ein
          # Zähler-Beispiel einschleust, fliegt es hier raus — es gehört nicht
          # zu dieser App und würde den Testlauf abbrechen.
          if grep -rl "Counter increments" test/ >/dev/null 2>&1; then
            grep -rl "Counter increments" test/ | xargs rm -f
            echo "::warning::Vorlagen-Test (Zähler-Beispiel) entfernt"
          fi
          ls test/

      - name: Abhängigkeiten auflösen
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get

      # Befunde werden zusätzlich als Annotationen ausgegeben: Die
      # Protokoll-Ablage der Läufe (Blob-Speicher) ist aus der
      # Entwicklungsumgebung nicht erreichbar, Annotationen über die
      # GitHub-API dagegen schon. So bleibt der Fehlerbefund lesbar.
      - name: Statische Analyse
        shell: bash
        run: |
          set -uo pipefail
          flutter analyze 2>&1 | tee analyze.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E '^[[:space:]]*(info|warning|error)[[:space:]]+' analyze.log \
              | head -n 60 | sed 's/^/::error::/'
            tail -n 3 analyze.log | sed 's/^/::error::/'
          fi
          exit "$status"

      # Jede Testdatei einzeln und unter `timeout`: Hängt ein Test, ist die
      # Zeitüberschreitung von package:test wirkungslos — sie läuft in derselben
      # Fake-Async-Zone wie der Test selbst und feuert deshalb nie. Nur eine
      # äußere Grenze beendet den Lauf, und der Dateiname nennt den Ort.
      #
      # Der Befund geht als Annotation raus (je Datei drei Blöcke à acht
      # Zeilen): Die Protokoll-Ablage der Läufe antwortet aus der
      # Entwicklungsumgebung mit EOF, Annotationen sind ohne Anmeldung auf der
      # Laufseite lesbar — GitHub zeigt allerdings höchstens zehn je Stufe.
      - name: Tests (Dart-VM mit echtem SQLite)
        timeout-minutes: 20
        shell: bash
        run: |
          # `shell: bash` ruft bash mit -eo pipefail auf. -e würde die Schleife
          # nach der ersten fehlerhaften Datei beenden — gerade die übrigen
          # Dateien sind aber der Befund. Also ausdrücklich ausschalten.
          set +e
          set -uo pipefail
          : > test.log
          status=0
          for datei in test/*_test.dart; do
            protokoll="test-$(basename "$datei" .dart).log"
            echo "=== ${datei} ===" >> test.log
            # --kill-after: SIGTERM erreicht den Testprozess hinter `flutter`
            # mitunter nicht; ohne zweite Stufe bleibt die Schleife stehen.
            timeout --kill-after=30 180 flutter test --reporter expanded \
              "$datei" > "$protokoll" 2>&1
            rc=$?
            cat "$protokoll" >> test.log
            if [ "$rc" -eq 0 ]; then
              echo "${datei}: grün" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            status=1
            if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
              echo "::error::${datei}: hängt — Zeitüberschreitung nach 180 s (Rückgabewert ${rc})"
            else
              echo "::error::${datei}: Rückgabewert ${rc}"
            fi
            # Alle Fehlschläge der Datei, nicht nur der erste: Prüfungsname
            # ([E]) je Fehlschlag, dazu jede Expected/Actual/Which-Zeile.
            {
              echo '-- Zählerstände:'
              grep -E '^[0-9]{2}:[0-9]{2} \+[0-9]+' "$protokoll" | tail -n 2
              echo '-- fehlgeschlagene Prüfungen:'
              grep -E '\[E\]$|\[E\] *$' "$protokoll" | head -n 4
              echo '-- Erwartungen:'
              grep -E '^ *(Expected|Actual|Which|The following|Test failed|A Timer)' "$protokoll" | head -n 10
              echo '-- Protokollende:'
              tail -n 5 "$protokoll"
            } | cut -c1-140 > befund-roh.txt
            for teil in 1 2 3; do
              anfang=$(( (teil - 1) * 8 + 1 ))
              meldung=$(sed -n "${anfang},$(( anfang + 7 ))p" befund-roh.txt \
                | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
              if [ -n "$meldung" ]; then
                echo "::error::${datei} Befund ${teil}/3: ${meldung}"
              fi
            done
          done
          tail -n 60 test.log >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: APK bauen (debug — auf dem CT45P installierbar)
        shell: bash
        run: |
          set -uo pipefail
          flutter build apk --debug 2>&1 | tee build-apk.log
          status=${PIPESTATUS[0]}
          ls -l build/app/outputs/flutter-apk/ >> "$GITHUB_STEP_SUMMARY" || true
          if [ "$status" -ne 0 ]; then
            grep -E 'FAILURE|error:|Exception|What went wrong|> ' build-apk.log \
              | head -n 40 | sed 's/^/::error::/'
            tail -n 5 build-apk.log | sed 's/^/::error::/'
          fi
          exit "$status"

      - name: Web bauen (release — Verwaltungsansicht)
        shell: bash
        run: |
          set -uo pipefail
          flutter build web --release 2>&1 | tee build-web.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E 'Error:|error:|Exception|Failed' build-web.log \
              | head -n 40 | sed 's/^/::error::/'
            tail -n 5 build-web.log | sed 's/^/::error::/'
          fi
          exit "$status"

      - name: APK als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: dingelag-apk-debug
          path: dingelag/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Web-Build als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: dingelag-web
          path: dingelag/build/web
          if-no-files-found: error

      - name: Ergebnis bei Fehlschlag zusammenfassen
        if: failure()
        shell: bash
        run: |
          {
            echo '## DinGelAg-App-Bau fehlgeschlagen'
            for log in analyze.log test.log build-apk.log build-web.log; do
              if [ -f "$log" ]; then
                echo "### $log"
                echo '```'
                tail -n 80 "$log"
                echo '```'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # Die Protokoll-Ablage der Läufe und die Job-Zusammenfassung sind aus der
      # Entwicklungsumgebung nicht abrufbar (Blob-Speicher antwortet mit EOF).
      # Ein Kommentar am Commit liegt dagegen auf api.github.com und ist lesbar:
      # `gh api repos/<inhaber>/<repo>/commits/<sha>/comments`.
      - name: Befund am Commit melden
        if: failure()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          {
            echo '## DinGelAg-App-Bau fehlgeschlagen'
            echo
            echo "Lauf: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "Commit: ${GITHUB_SHA}"
            echo
            echo '```'
            which flutter || true
            flutter --version || true
            echo '```'
            for log in analyze.log test.log build-apk.log build-web.log; do
              echo
              if [ -s "$log" ]; then
                echo "### ${log} — $(wc -l < "$log") Zeilen, letzte 250"
              elif [ -f "$log" ]; then
                echo "### ${log} — LEER (Befehl lieferte keine Ausgabe)"
              else
                echo "### ${log} — fehlt (Schritt kam nicht bis hierher)"
                continue
              fi
              echo '```'
              tail -n 250 "$log"
              echo '```'
            done
          } > befund.md
          python3 - <<'PY' > payload.json
          import json, pathlib
          text = pathlib.Path('befund.md').read_text(encoding='utf-8')
          print(json.dumps({'body': text[:60000]}))
          PY
          curl -sS -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            --data @payload.json -o antwort.json -w 'HTTP %{http_code}\n'
          head -c 400 antwort.json || true
