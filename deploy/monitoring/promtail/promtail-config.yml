server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

# Sammelt die JSON-Container-Logs des App-Stacks (Flask auth :5000,
# pty_bridge :8768, scanner :8766, status_board :8767). Strukturierte
# Logs (session_id/trace_id) werden als Loki-Labels nutzbar.
scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        target_label: container
      - source_labels: [__meta_docker_container_id]
        target_label: container_id
    pipeline_stages:
      - json:
          expressions:
            trace_id: trace_id
            session_id: session_id
            level: level
      - labels:
          trace_id:
          level:

  # Mobiles BLE-Gateway: Audit-JSONL (action + token_id/zone/battery, ablehnungsgründe).
  # Ermöglicht in Grafana/Explore z. B. {job="gateway-audit", action="denied"}.
  - job_name: gateway-audit
    static_configs:
      - targets:
          - localhost
        labels:
          job: gateway-audit
          host: mobile-ble-gateway
          __path__: /host/gateway-data/gateway_audit.jsonl
    pipeline_stages:
      - json:
          expressions:
            action: action
            sid: detail.sid
            token_id: detail.token_id
            zone: detail.zone
            battery_mv: detail.battery_mv
            reason: detail.reason
      - labels:
          action:
          zone:
      - timestamp:
          source: ts
          format: unix
