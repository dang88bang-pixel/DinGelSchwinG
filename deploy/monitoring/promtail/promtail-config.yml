server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

# Sammelt die JSON-Container-Logs des App-Stacks (Flask auth :5000,
# pty_bridge :8765, scanner :8766, status_board :8767). Strukturierte
# Logs (session_id/trace_id) werden als Loki-Labels nutzbar.
scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        target_label: container
      - source_labels: [__meta_docker_container_id]
        target_label: container_id
    pipeline_stages:
      - json:
          expressions:
            trace_id: trace_id
            session_id: session_id
            level: level
      - labels:
          trace_id:
          level:
