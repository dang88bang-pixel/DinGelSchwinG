global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # App-Backend (Flask auf :5000) muss /metrics im Prometheus-Format liefern.
  # Minimal mit prometheus-flask-exporter oder eigenem Endpoint.
  - job_name: nexus-backend
    static_configs:
      - targets: ["host.docker.internal:5000"]
    metrics_path: /api/metrics

  # Selbstüberwachung
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  # MCP-Bridge (mcp/bridge.mjs): Tool-Aufrufe, Cache-Trefferquote, Agent-Läufe.
  # Läuft auf dem Host, nicht im Container -> host.docker.internal.
  - job_name: mcp-bridge
    static_configs:
      - targets: ["host.docker.internal:8790"]
    metrics_path: /metrics

  # Mobiles BLE-Gateway (Honeywell CT45P Xon+ Modell): Grants/Denies/Tamper,
  # offene Challenges, BLE-Werbung. Port 8791 (mobile-server/).
  - job_name: mobile-gateway
    static_configs:
      - targets: ["host.docker.internal:8791"]
        labels: {tier: "edge"}
    metrics_path: /metrics
