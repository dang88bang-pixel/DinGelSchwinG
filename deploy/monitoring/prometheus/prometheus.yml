global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # App-Backend (Flask auf :5000) muss /metrics im Prometheus-Format liefern.
  # Minimal mit prometheus-flask-exporter oder eigenem Endpoint.
  - job_name: nexus-backend
    static_configs:
      - targets: ["host.docker.internal:5000"]
    metrics_path: /api/metrics

  # Selbstüberwachung
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
