# NEXUS-BUILDER – Nginx für das gebaute React/SPA-Frontend.
# API-/WS-Proxy analog zur Vite-Dev-Config (vite.config.ts):
#   /api/ws/terminal|discovery|status → backend-WS-Kanäle (Query bleibt erhalten)
#   /api → backend REST :5000
#   sonst → SPA-Fallback auf index.html

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # WS: Terminal-Bridge (Query-Parameter token/kind/target bleiben erhalten)
    location /api/ws/terminal {
        proxy_pass http://backend:8765/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }
    location /api/ws/discovery {
        proxy_pass http://backend:8766/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }
    location /api/ws/status {
        proxy_pass http://backend:8767/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    # REST-API
    location /api {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA-Fallback (React ohne Router → index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
