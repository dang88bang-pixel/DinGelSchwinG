// Top-level build file where you can add configuration information common to
// all sub-projects/modules.

buildscript {

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // AGP 8.13.0 + Gradle 8.14.3 + JDK 21 = offizieller Capacitor-8-Stack.
        // Nur ab AGP >= 8.9.1 laesst sich compileSdk 36 (Android 16) bauen.
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // Kotlin fuer das Device-Control-Subsystem (ADB/Fastboot-Engine,
        // Port-View, ROM-Datenbank, Brick-Schutz) – siehe docs/device-control.md.
        // Achtung Kompatibilitaet (developer.android.com/build/kotlin-support):
        // AGP 8.13 erfordert Kotlin 2.3.x (Kotlin 1.9 unterstuetzt nur AGP bis 8.2).
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.3.21'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
