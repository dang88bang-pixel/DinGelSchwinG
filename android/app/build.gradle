apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// Release-Signierung: Werte kommen aus Umgebungsvariablen (CI: Secrets,
// lokal: export ...). Ohne Keystore wird mit dem Debug-Schlüssel signiert,
// damit `assembleRelease` immer ein installierbares APK erzeugt.
def keystorePath = System.getenv('KEYSTORE_PATH')
def keystorePassword = System.getenv('KEYSTORE_PASSWORD')
def keyAliasName = System.getenv('KEY_ALIAS')
def keyPasswordVal = System.getenv('KEY_PASSWORD')
def hasReleaseKeystore = keystorePath != null && !keystorePath.isEmpty() && file(keystorePath).exists()

android {
    namespace "com.dingelschwinng.moeagent"
    // compileSdk/targetSdk 36 (Android 16), minSdk 30 (Android 11) – siehe variables.gradle
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.dingelschwinng.moeagent"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode Integer.parseInt(System.getenv('APP_VERSION_CODE') ?: '1')
        versionName System.getenv('APP_VERSION') ?: '1.0'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        androidResources {
            // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
            // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Capacitor 8 / AGP 8.13 bauen mit JDK 21 (Bytecode-Ziel 21).
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias keyAliasName
                keyPassword keyPasswordVal
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }
    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // Device-Control-Subsystem: RecyclerView fuer Port-View/Chat,
    // LiveData fuer die Live-Geraeteliste (USB + ADB)
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.4'
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
