openapi: 3.0.3
info:
  title: DinGelSchwinG / NEXUS-BUILDER Backend-API
  version: "2.2"
  description: |
    REST-Oberfläche des Server-Backends (Architektur gemäß README v2.2).
    Zusätzlich existieren WebSocket-Kanäle (Terminal, Discovery, Live-Status),
    dokumentiert in [api-websockets.md](./api-websockets.md).

    **Rollenhierarchie:** `guest(0) < operator(1) < service(2) < developer(3)
    < expert(4) < emergency(5)` — jede Operation trägt die Mindestrolle als
    `x-rbac`. Durchsetzung ausschließlich serverseitig.

    Kritische Aktionen (`device.delete`, `pairing.delete`, `client.server`,
    `client.kick`) verlangen zusätzlich eine WebAuthn-Assertion
    (`X-WebAuthn-Token`, siehe `/api/webauthn/*`).

tags:
  - name: auth
  - name: devices
  - name: pairings
  - name: clients
  - name: audit
  - name: webauthn
  - name: console
  - name: ble

servers:
  - url: http://localhost:5000
    description: Entwicklung (direkt)
  - url: https://yourdomain.com
    description: Produktion (via NGINX-Reverse-Proxy, /api)

paths:
  /api/health:
    get:
      tags: [auth]
      summary: Health-Check (Proxy/Monitoring)
      x-rbac: guest
      responses:
        "200":
          description: Dienst lebt
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
        "405": { $ref: "#/components/responses/JsonError" }

  /api/login:
    post:
      tags: [auth]
      summary: Login → JWT ausstellen
      x-rbac: guest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: JWT (Claims sub/role/iat/exp)
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  role: { $ref: "#/components/schemas/Role" }
        "400": { $ref: "#/components/responses/JsonError" }
        "401": { $ref: "#/components/responses/JsonError" }
        "429": { $ref: "#/components/responses/JsonError" }

  /api/devices:
    get:
      tags: [devices]
      summary: Geräte auflisten (rechtegefiltert, inkl. permissions)
      x-rbac: operator
      responses:
        "200":
          description: Geräteliste
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Device" }
        "401": { $ref: "#/components/responses/JsonError" }
        "403": { $ref: "#/components/responses/JsonError" }
    post:
      tags: [devices]
      summary: Gerät binden (write; BLE/NTag/Netzwerk ab developer)
      x-rbac: service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, kind]
              properties:
                id: { type: string }
                kind:
                  type: string
                  enum: [hardware, dongle, ble_token, ntag, network]
                label: { type: string }
      responses:
        "201":
          description: Gebunden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "400": { $ref: "#/components/responses/JsonError" }
        "403": { $ref: "#/components/responses/JsonError" }

  /api/devices/{id}:
    patch:
      tags: [devices]
      summary: Gerät ändern (Label)
      x-rbac: service
      parameters: [{ $ref: "#/components/parameters/DeviceId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string }
      responses:
        "200":
          description: Aktualisiert
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "404": { $ref: "#/components/responses/JsonError" }
    delete:
      tags: [devices]
      summary: Gerät löschen/unbinden (⚠️ WebAuthn-Pflicht)
      x-rbac: service
      parameters:
        - { $ref: "#/components/parameters/DeviceId" }
        - { $ref: "#/components/parameters/WebAuthnToken" }
      responses:
        "204": { description: Gelöscht }
        "403": { $ref: "#/components/responses/JsonError" }
        "404": { $ref: "#/components/responses/JsonError" }

  /api/pairings:
    get:
      tags: [pairings]
      summary: Pairings auflisten
      x-rbac: operator
      responses:
        "200":
          description: Pairing-Liste
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Pairing" }
    post:
      tags: [pairings]
      summary: Pairing erstellen (write auf alle Mitglieds-Ressourcen nötig)
      x-rbac: service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, deviceIds]
              properties:
                name: { type: string }
                deviceIds:
                  type: array
                  items: { type: string }
                  minItems: 1
      responses:
        "201":
          description: Erstellt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pairing" }
        "400": { $ref: "#/components/responses/JsonError" }
        "404": { $ref: "#/components/responses/JsonError" }

  /api/pairings/{pid}:
    delete:
      tags: [pairings]
      summary: Pairing löschen (⚠️ WebAuthn-Pflicht)
      x-rbac: service
      parameters:
        - name: pid
          in: path
          required: true
          schema: { type: string }
        - { $ref: "#/components/parameters/WebAuthnToken" }
      responses:
        "204": { description: Gelöscht }
        "404": { $ref: "#/components/responses/JsonError" }

  /api/pairings/{pid}/devices:
    post:
      tags: [pairings]
      summary: Gerät zum Pairing hinzufügen
      x-rbac: service
      parameters:
        - name: pid
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId]
              properties:
                deviceId: { type: string }
      responses:
        "200": { description: Hinzugefügt }
        "404": { $ref: "#/components/responses/JsonError" }

  /api/pairings/{pid}/devices/{id}:
    delete:
      tags: [pairings]
      summary: Gerät aus Pairing entfernen
      x-rbac: service
      parameters:
        - name: pid
          in: path
          required: true
          schema: { type: string }
        - { $ref: "#/components/parameters/DeviceId" }
      responses:
        "200": { description: Entfernt }
        "404": { $ref: "#/components/responses/JsonError" }

  /api/pairings/{pid}/sync:
    post:
      tags: [pairings]
      summary: Sync auslösen (idempotent via Zeitstempel)
      x-rbac: service
      parameters:
        - name: pid
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Sync-Ergebnis
          content:
            application/json:
              schema:
                type: object
                properties:
                  synced: { type: boolean }
                  ts: { type: string, format: date-time }
        "404": { $ref: "#/components/responses/JsonError" }

  /api/clients:
    get:
      tags: [clients]
      summary: Clients auflisten
      x-rbac: operator
      responses:
        "200":
          description: Client-Liste
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Client" }

  /api/clients/{id}:
    delete:
      tags: [clients]
      summary: Client abmelden / kick (⚠️ WebAuthn-Pflicht)
      x-rbac: service
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - { $ref: "#/components/parameters/WebAuthnToken" }
      responses:
        "204": { description: Abgemeldet }
        "404": { $ref: "#/components/responses/JsonError" }

  /api/clients/register:
    post:
      tags: [clients]
      summary: Client registrieren + Heartbeat (REST-Registry)
      x-rbac: operator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientId]
              properties:
                clientId: { type: string }
                device: { type: string }
      responses:
        "200": { description: Registriert }

  /api/clients/{id}/server:
    patch:
      tags: [clients]
      summary: Client als Server markieren (⚠️ WebAuthn-Pflicht)
      x-rbac: service
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - { $ref: "#/components/parameters/WebAuthnToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { type: string, enum: [client, server] }
      responses:
        "200": { description: Gesetzt }
        "404": { $ref: "#/components/responses/JsonError" }

  /api/audit:
    get:
      tags: [audit]
      summary: Audit-Trail abfragen (trace-Ketten)
      x-rbac: service
      parameters:
        - name: trace_id
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Audit-Einträge (Append-only, mit trace_id + step)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditEntry" }

  /api/webauthn/challenge:
    post:
      tags: [webauthn]
      summary: FIDO2-Challenge anfordern
      x-rbac: service
      responses:
        "200":
          description: Challenge für Kritische Aktion
          content:
            application/json:
              schema:
                type: object
                properties:
                  challenge: { type: string }
                  rpId: { type: string }

  /api/webauthn/assert:
    post:
      tags: [webauthn]
      summary: Assertion prüfen → einmaliges X-WebAuthn-Token
      x-rbac: service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                credentialId: { type: string }
                clientDataJSON: { type: string }
                authenticatorData: { type: string }
                signature: { type: string }
      responses:
        "200":
          description: Einmal-Grant (Replay-geschützt)
          content:
            application/json:
              schema:
                type: object
                properties:
                  grant: { type: string }

  /api/devices-status:
    get:
      tags: [console]
      summary: (Desktop-Konsole) Geräte-Statusübersicht
      x-rbac: operator
      responses:
        "200":
          description: Statusliste (Mock-Fähig, Desktop-App nutzt localhost:5000)

  /api/workflows:
    get:
      tags: [console]
      summary: (Desktop-Konsole) Workflows auflisten
      x-rbac: operator
      responses:
        "200": { description: Workflow-Liste }

  /api/tests:
    get:
      tags: [console]
      summary: (Desktop-Konsole) Testverbindungen auflisten
      x-rbac: operator
      responses:
        "200": { description: Testliste }

  /api/system:
    get:
      tags: [console]
      summary: (Desktop-Konsole) Systemlast/Systeminfo
      x-rbac: operator
      responses:
        "200": { description: Systeminfo }

  /api/system/features:
    get:
      tags: [admin]
      summary: Feature-Toggles der Background-Services abrufen
      x-rbac: service
      responses:
        "200": { description: features }
    patch:
      tags: [admin]
      summary: Feature-Toggle setzen (schaltet echte Scan-/Server-Tasks)
      x-rbac: emergency
      x-webauthn: true
      responses:
        "200": { description: ok }
        "428": { description: WEBAUTHN_REQUIRED }

  /api/metrics/live:
    get:
      tags: [console]
      summary: Live-Metriken (CPU/RAM/Uptime/Geräte/Alerts) für Dashboard-Widgets
      x-rbac: operator
      responses:
        "200": { description: live metrics }

  /api/admin/rbac:
    get:
      tags: [admin]
      summary: Dynamische RBAC-Matrix (Rollen × Aktionen, inkl. Overrides)
      x-rbac: emergency
      responses:
        "200": { description: matrix }
    patch:
      tags: [admin]
      summary: RBAC-Override setzen/zurücksetzen – wirkt live auf die Autorisierung
      x-rbac: emergency
      x-webauthn: true
      responses:
        "200": { description: ok }
        "428": { description: WEBAUTHN_REQUIRED }

  /api/agent/execute:
    post:
      tags: [agent]
      summary: Befehl auf einem gebundenen Gerät ausführen (SSH/HTTP/Ping/BLE/Bluetooth)
      x-rbac: service
      responses:
        "200": { description: Ausführung + Analyse }

  /api/devices/bound:
    get:
      tags: [discovery]
      summary: Gebundene Geräte (Device-Registry, Agent-Grundlage)
      x-rbac: service
      responses:
        "200": { description: devices }

  /api/devices/bind:
    post:
      tags: [discovery]
      summary: Discovery-Node binden (Protokoll-Ableitung oder explizit)
      x-rbac: service
      responses:
        "201": { description: gebunden }
        "404": { description: node nicht gefunden }
  /api/devices/bind/{id}:
    delete:
      tags: [discovery]
      summary: Gerät entbinden
      x-rbac: service
      responses:
        "200": { description: ok }

  # ------------------------------------------------------------------
  # BLE Professional Suite (NEXUS-BUILDER)
  # Kritische Aktionen (mesh delete, Profil anwenden, Fehlersimulation)
  # erfordern X-WebAuthn-Token (siehe /api/webauthn/*) – wie bei
  # device.delete/pairing.delete.
  # ------------------------------------------------------------------
  /api/ble/scan:
    post:
      tags: [ble]
      summary: BLE-Scan starten/stoppen (kontinuierlich, Klassifizierung)
      x-rbac: service
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                action: { type: string, enum: [start, stop] }
      responses:
        "200":
          description: Scan-Status
          content:
            application/json:
              schema:
                type: object
                properties:
                  running: { type: boolean }
                  devices: { type: integer }

  /api/ble/devices:
    get:
      tags: [ble]
      summary: Erkannte BLE-Geräte (gefiltert, klassifiziert)
      x-rbac: service
      parameters:
        - name: class
          in: query
          schema: { type: string, enum: [ntag, token, mesh, peripheral] }
        - name: query
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Geräteliste
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BleDevice" }

  /api/ble/devices/{id}/connect:
    post:
      tags: [ble]
      summary: BLE-Verbindung aufbauen/trennen (max. 20 parallel)
      x-rbac: service
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                action: { type: string, enum: [connect, disconnect] }
      responses:
        "200": { description: Verbindungsstatus }

  /api/ble/devices/{id}/gatt:
    get:
      tags: [ble]
      summary: GATT-Services/Characteristics/Descriptors eines Geräts
      x-rbac: service
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          description: GATT-Profil
          content:
            application/json:
              schema:
                type: object
                properties:
                  deviceId: { type: string }
                  mtu: { type: integer }
                  services:
                    type: array
                    items: { $ref: "#/components/schemas/GattService" }

  /api/ble/devices/{id}/gatt/{uuid}:
    put:
      tags: [ble]
      summary: GATT-Wert schreiben (hex)
      x-rbac: service
      parameters:
        - $ref: "#/components/parameters/DeviceId"
        - name: uuid
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value: { type: string, description: "Hex, z. B. BEEF" }
      responses:
        "200": { description: Write-Bestätigung }

  /api/ble/mesh/networks:
    get:
      tags: [ble]
      summary: Mesh-Netzwerke mit Knoten, Rollen, Pub/Sub, TTL
      x-rbac: service
      responses:
        "200":
          description: Netzwerkliste
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MeshNetwork" }
    post:
      tags: [ble]
      summary: Mesh-Netzwerk erstellen (zentrale NetKey/AppKey-Verwaltung)
      x-rbac: developer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "201": { description: Netzwerk erstellt }

  /api/ble/mesh/networks/{id}/nodes/{deviceId}:
    post:
      tags: [ble]
      summary: Knoten provisionieren (Rolle Relay/Proxy, Unicast-Vergabe)
      x-rbac: developer
      parameters:
        - $ref: "#/components/parameters/DeviceId"
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Provisionierung abgeschlossen }

  /api/ble/mesh/networks/{id}:
    delete:
      tags: [ble]
      summary: "Mesh-Netzwerk löschen (KRITISCH → X-WebAuthn-Token)"
      x-rbac: developer
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/WebAuthnToken"
      responses:
        "200": { description: Netzwerk gelöscht }

  /api/ble/profiles:
    get:
      tags: [ble]
      summary: Profil-Cache auflisten
      x-rbac: service
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BleProfile" }
    post:
      tags: [ble]
      summary: Profil speichern
      x-rbac: service
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name, deviceClass, steps]
              properties:
                name: { type: string }
                deviceClass: { type: string, enum: [ntag, token, mesh, peripheral] }
                steps:
                  type: array
                  items: { $ref: "#/components/schemas/ConfigStep" }
      responses:
        "201": { description: Profil gespeichert }

  /api/ble/profiles/{id}/apply:
    post:
      tags: [ble]
      summary: "Profil auf Gerät anwenden (KRITISCH → X-WebAuthn-Token)"
      x-rbac: developer
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/WebAuthnToken"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [deviceId]
              properties:
                deviceId: { type: string }
      responses:
        "200": { description: Konfiguration angewendet }

  /api/ble/tests/{suiteId}/run:
    post:
      tags: [ble]
      summary: Vordefinierte Test-Suite starten (ntag|token|mesh|performance)
      x-rbac: service
      parameters:
        - name: suiteId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Testergebnis }

  /api/ble/simulator:
    post:
      tags: [ble]
      summary: Simulierte BLE-Geräte erzeugen (max. 10)
      x-rbac: service
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                count: { type: integer, maximum: 10 }
                deviceClass: { type: string, enum: [ntag, token, mesh, peripheral] }
      responses:
        "201": { description: Sim-Geräte erstellt }

  /api/ble/audit:
    get:
      tags: [ble]
      summary: BLE-Audit-Log (Export JSON/CSV)
      x-rbac: operator
      parameters:
        - name: format
          in: query
          schema: { type: string, enum: [json, csv] }
      responses:
        "200": { description: Audit-Einträge }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    DeviceId:
      name: id
      in: path
      required: true
      schema: { type: string }
    WebAuthnToken:
      name: X-WebAuthn-Token
      in: header
      required: true
      description: Einmal-Grant aus /api/webauthn/assert (Replay-geschützt)
      schema: { type: string }

  responses:
    JsonError:
      description: Strukturierter Fehler (keine Interna)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Role:
      type: string
      enum: [guest, operator, service, developer, expert, emergency]

    Error:
      type: object
      properties:
        type: { type: string, example: error }
        code:
          type: string
          example: RBAC_DENIED
          description: u. a. RBAC_DENIED, DONGLE_MISSING, TERMINAL_SESSION_TIMEOUT
        message: { type: string }

    Device:
      type: object
      properties:
        id: { type: string }
        kind:
          type: string
          enum: [hardware, dongle, ble_token, ble_mesh, ble_peripheral, ntag, network]
        label: { type: string }
        online: { type: boolean }
        autoBindable: { type: boolean }
        usbVendorId: { type: string, example: "0x2341" }
        usbProductId: { type: string }
        signal:
          type: object
          properties:
            rssi: { type: integer }
        permissions:
          type: object
          additionalProperties:
            type: array
            items: { type: string, enum: [read, write, update, delete] }

    Pairing:
      type: object
      properties:
        pid: { type: string }
        name: { type: string }
        deviceIds:
          type: array
          items: { type: string }
        lastSync: { type: string, format: date-time }

    Client:
      type: object
      properties:
        id: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        device: { type: string }
        mode: { type: string, enum: [client, server] }
        online: { type: boolean }
        lastSeen: { type: string, format: date-time }

    AuditEntry:
      type: object
      properties:
        ts: { type: string, format: date-time }
        trace_id: { type: string }
        step:
          type: string
          example: device.bind
          description: "Kette: trace.start → auth.login → device.bind …"
        actor_role: { $ref: "#/components/schemas/Role" }
        outcome: { type: string, enum: [ok, denied, error] }

    BleDevice:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        address: { type: string, example: "D8:3A:DD:12:4F:01" }
        deviceClass: { type: string, enum: [ntag, token, mesh, peripheral] }
        manufacturer: { type: string }
        serviceUuids:
          type: array
          items: { type: string }
        rssi: { type: integer }
        txPower: { type: integer }
        connectable: { type: boolean }
        bound: { type: boolean }
        connected: { type: boolean }
        battery: { type: integer }
        provisioned: { type: boolean }

    GattService:
      type: object
      properties:
        uuid: { type: string }
        name: { type: string }
        characteristics:
          type: array
          items:
            type: object
            properties:
              uuid: { type: string }
              name: { type: string }
              properties:
                type: array
                items: { type: string, enum: [read, write, notify, indicate] }
              valueHex: { type: string }
              notify: { type: boolean }

    MeshNetwork:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        netKey: { type: string, description: "zentral verwaltet, RBAC-geschützt" }
        appKey: { type: string }
        ttl: { type: integer }
        nodes:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              unicast: { type: string, example: "0x0001" }
              role: { type: string, enum: [relay, proxy, friend, low-power] }
              rssi: { type: integer }
              battery: { type: integer }
              online: { type: boolean }
              pub: { type: string }
              sub: { type: string }

    ConfigStep:
      type: object
      properties:
        type:
          type: string
          enum: [gatt_write, gatt_read, notify_on, mtu, pair, mesh_pub, mesh_sub, mesh_model, ttl, verify]
        target: { type: string }
        detail: { type: string }
        value: { type: string }
        critical: { type: boolean }

    BleProfile:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        deviceClass: { type: string, enum: [ntag, token, mesh, peripheral] }
        steps:
          type: array
          items: { $ref: "#/components/schemas/ConfigStep" }
        createdAt: { type: string, format: date-time }

security:
  - bearerAuth: []
