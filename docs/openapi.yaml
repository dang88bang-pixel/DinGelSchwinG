openapi: 3.0.3
info:
  title: DinGelSchwinG / NEXUS-BUILDER Backend-API
  version: "2.2"
  description: |
    REST-Oberfläche des Server-Backends (Architektur gemäß README v2.2).
    Zusätzlich existieren WebSocket-Kanäle (Terminal, Discovery, Live-Status),
    dokumentiert in [api-websockets.md](./api-websockets.md).

    **Rollenhierarchie:** `guest(0) < operator(1) < service(2) < developer(3)
    < expert(4) < emergency(5)` — jede Operation trägt die Mindestrolle als
    `x-rbac`. Durchsetzung ausschließlich serverseitig.

    Kritische Aktionen (`device.delete`, `pairing.delete`, `client.server`,
    `client.kick`) verlangen zusätzlich eine WebAuthn-Assertion
    (`X-WebAuthn-Token`, siehe `/api/webauthn/*`).

tags:
  - name: auth
  - name: devices
  - name: pairings
  - name: clients
  - name: audit
  - name: webauthn
  - name: console
  - name: discovery
  - name: diagnostics
  - name: ops

servers:
  - url: http://localhost:5000
    description: Entwicklung (direkt)
  - url: https://yourdomain.com
    description: Produktion (via NGINX-Reverse-Proxy, /api)

paths:
  /api/health:
    get:
      tags: [auth]
      summary: Health-Check (Proxy/Monitoring)
      x-rbac: guest
      responses:
        "200":
          description: Dienst lebt
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
        "405": { $ref: "#/components/responses/JsonError" }

  /api/login:
    post:
      tags: [auth]
      summary: Login → JWT ausstellen
      x-rbac: guest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: JWT (Claims sub/role/iat/exp)
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  role: { $ref: "#/components/schemas/Role" }
        "400": { $ref: "#/components/responses/JsonError" }
        "401": { $ref: "#/components/responses/JsonError" }
        "429": { $ref: "#/components/responses/JsonError" }

  /api/devices:
    get:
      tags: [devices]
      summary: Geräte auflisten (rechtegefiltert, inkl. permissions)
      x-rbac: operator
      responses:
        "200":
          description: Geräteliste
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Device" }
        "401": { $ref: "#/components/responses/JsonError" }
        "403": { $ref: "#/components/responses/JsonError" }
    post:
      tags: [devices]
      summary: Gerät binden (write; BLE/NTag/Netzwerk ab developer)
      x-rbac: service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, kind]
              properties:
                id: { type: string }
                kind:
                  type: string
                  enum: [hardware, dongle, ble_token, ntag, network]
                label: { type: string }
      responses:
        "201":
          description: Gebunden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "400": { $ref: "#/components/responses/JsonError" }
        "403": { $ref: "#/components/responses/JsonError" }

  /api/devices/{id}:
    patch:
      tags: [devices]
      summary: Gerät ändern (Label)
      x-rbac: service
      parameters: [{ $ref: "#/components/parameters/DeviceId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string }
      responses:
        "200":
          description: Aktualisiert
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "404": { $ref: "#/components/responses/JsonError" }
    delete:
      tags: [devices]
      summary: Gerät löschen/unbinden (⚠️ WebAuthn-Pflicht)
      x-rbac: service
      parameters:
        - { $ref: "#/components/parameters/DeviceId" }
        - { $ref: "#/components/parameters/WebAuthnToken" }
      responses:
        "204": { description: Gelöscht }
        "403": { $ref: "#/components/responses/JsonError" }
        "404": { $ref: "#/components/responses/JsonError" }

  /api/pairings:
    get:
      tags: [pairings]
      summary: Pairings auflisten
      x-rbac: operator
      responses:
        "200":
          description: Pairing-Liste
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Pairing" }
    post:
      tags: [pairings]
      summary: Pairing erstellen (write auf alle Mitglieds-Ressourcen nötig)
      x-rbac: service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, deviceIds]
              properties:
                name: { type: string }
                deviceIds:
                  type: array
                  items: { type: string }
                  minItems: 1
      responses:
        "201":
          description: Erstellt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pairing" }
        "400": { $ref: "#/components/responses/JsonError" }
        "404": { $ref: "#/components/responses/JsonError" }

  /api/pairings/{pid}:
    delete:
      tags: [pairings]
      summary: Pairing löschen (⚠️ WebAuthn-Pflicht)
      x-rbac: service
      parameters:
        - name: pid
          in: path
          required: true
          schema: { type: string }
        - { $ref: "#/components/parameters/WebAuthnToken" }
      responses:
        "204": { description: Gelöscht }
        "404": { $ref: "#/components/responses/JsonError" }

  /api/pairings/{pid}/devices:
    post:
      tags: [pairings]
      summary: Gerät zum Pairing hinzufügen
      x-rbac: service
      parameters:
        - name: pid
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId]
              properties:
                deviceId: { type: string }
      responses:
        "200": { description: Hinzugefügt }
        "404": { $ref: "#/components/responses/JsonError" }

  /api/pairings/{pid}/devices/{id}:
    delete:
      tags: [pairings]
      summary: Gerät aus Pairing entfernen
      x-rbac: service
      parameters:
        - name: pid
          in: path
          required: true
          schema: { type: string }
        - { $ref: "#/components/parameters/DeviceId" }
      responses:
        "200": { description: Entfernt }
        "404": { $ref: "#/components/responses/JsonError" }

  /api/pairings/{pid}/sync:
    post:
      tags: [pairings]
      summary: Sync auslösen (idempotent via Zeitstempel)
      x-rbac: service
      parameters:
        - name: pid
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Sync-Ergebnis
          content:
            application/json:
              schema:
                type: object
                properties:
                  synced: { type: boolean }
                  ts: { type: string, format: date-time }
        "404": { $ref: "#/components/responses/JsonError" }

  /api/clients:
    get:
      tags: [clients]
      summary: Clients auflisten
      x-rbac: operator
      responses:
        "200":
          description: Client-Liste
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Client" }

  /api/clients/{id}:
    delete:
      tags: [clients]
      summary: Client abmelden / kick (⚠️ WebAuthn-Pflicht)
      x-rbac: service
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - { $ref: "#/components/parameters/WebAuthnToken" }
      responses:
        "204": { description: Abgemeldet }
        "404": { $ref: "#/components/responses/JsonError" }

  /api/clients/register:
    post:
      tags: [clients]
      summary: Client registrieren + Heartbeat (REST-Registry)
      x-rbac: operator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientId]
              properties:
                clientId: { type: string }
                device: { type: string }
      responses:
        "200": { description: Registriert }

  /api/clients/{id}/server:
    patch:
      tags: [clients]
      summary: Client als Server markieren (⚠️ WebAuthn-Pflicht)
      x-rbac: service
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - { $ref: "#/components/parameters/WebAuthnToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { type: string, enum: [client, server] }
      responses:
        "200": { description: Gesetzt }
        "404": { $ref: "#/components/responses/JsonError" }

  /api/audit:
    get:
      tags: [audit]
      summary: Audit-Trail abfragen (trace-Ketten)
      x-rbac: service
      parameters:
        - name: trace_id
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Audit-Einträge (Append-only, mit trace_id + step)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditEntry" }

  /api/webauthn/challenge:
    post:
      tags: [webauthn]
      summary: FIDO2-Challenge anfordern
      x-rbac: service
      responses:
        "200":
          description: Challenge für Kritische Aktion
          content:
            application/json:
              schema:
                type: object
                properties:
                  challenge: { type: string }
                  rpId: { type: string }

  /api/webauthn/assert:
    post:
      tags: [webauthn]
      summary: Assertion prüfen → einmaliges X-WebAuthn-Token
      x-rbac: service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                credentialId: { type: string }
                clientDataJSON: { type: string }
                authenticatorData: { type: string }
                signature: { type: string }
      responses:
        "200":
          description: Einmal-Grant (Replay-geschützt)
          content:
            application/json:
              schema:
                type: object
                properties:
                  grant: { type: string }

  /api/devices-status:
    get:
      tags: [console]
      summary: (Desktop-Konsole) Geräte-Statusübersicht
      x-rbac: operator
      responses:
        "200":
          description: Statusliste (Desktop-App nutzt localhost:5000)

  /api/workflows:
    get:
      tags: [console]
      summary: (Desktop-Konsole) Workflow-Läufe auflisten
      description: |
        Liefert die letzten Läufe inkl. `steps[]` (Status, Exit-Code, Dauer,
        Detail je Schritt) und `error` — A-2.
      x-rbac: operator
      responses:
        "200": { description: "[{ name, title, status, progress, started, finished, steps[], result?, error? }]" }
    post:
      tags: [console]
      summary: Workflow der Registry ausführen (Schritte sequenziell, echter Fortschritt)
      description: |
        Die ausführbaren Workflows stehen als Daten in `config/workflows.json`
        (A-2); `GET /api/workflows/registry` listet sie. Jeder Schritt läuft
        sequenziell und meldet Status, Dauer und Detail — `kind: builtin` im
        Prozess, `kind: script` als SHA-256-gepinnter Subprocess aus der
        Skript-Whitelist (Exit-Code entscheidet über den Schrittstatus).

        Ein Name, der nicht in der Registry steht, antwortet **501
        NOT_IMPLEMENTED** samt `registry[]` statt eines erfundenen Erfolgs.
        Nur deklarierte Parameter werden akzeptiert und gegen ihr Muster
        geprüft, sonst **400 PARAMS_INVALID**.
      x-rbac: service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, example: scan_network, description: "Name oder Alias aus der Registry" }
                params:
                  type: object
                  description: "Alternative zu flachen Schlüsseln; nur deklarierte Parameter"
                  additionalProperties: { type: string }
                subnet: { type: string, example: "192.168.1.0/24", description: "Kurzform für scan_network" }
                path: { type: string, example: "/", description: "host_health: Dateisystem" }
                min_free_gb: { type: string, example: "1", description: "host_health: Schwelle in GB" }
      responses:
        "200":
          description: "{ name, title, status, progress, started, finished, durationMs, steps[], result?, error? }"
        "400": { $ref: "#/components/responses/JsonError" }
        "403": { $ref: "#/components/responses/JsonError" }
        "501": { $ref: "#/components/responses/JsonError" }
        "503": { $ref: "#/components/responses/JsonError" }

  /api/workflows/registry:
    get:
      tags: [console]
      summary: Workflow-Definitionen (read-only)
      description: |
        Inhalt von `config/workflows.json` mit Schritten, Parametern und
        Timeouts — damit die UI keine Namen hartkodieren muss (A-2).
      x-rbac: operator
      responses:
        "200":
          description: "{ config, count, workflows: [{ name, title, description, timeout, aliases[], params[], steps[] }] }"
        "503": { $ref: "#/components/responses/JsonError" }

  /api/scripts:
    get:
      tags: [ops]
      summary: Skript-Whitelist samt Integritätsbefund (read-only)
      description: |
        Liefert die in `server/data/scripts/manifest.json` freigegebenen Skripte
        mit erlaubten Argumenten (Muster/Default), Timeout, SHA-256-Pin und dem
        Prüfergebnis `sha256Ok`/`integrity` (A-1). Das Operations-Center baut
        daraus seine Skriptliste.
      x-rbac: operator
      responses:
        "200":
          description: "{ scriptsDir, manifest, count, executable, scripts: [{ name, kind, description, timeout, args[], aliases[], file?, sha256?, present?, sha256Ok?, integrity?, handler? }] }"
        "503": { $ref: "#/components/responses/JsonError" }

  /api/tests:
    get:
      tags: [console]
      summary: (Desktop-Konsole) Testverbindungen auflisten
      x-rbac: operator
      responses:
        "200": { description: Testliste }

  /api/system:
    get:
      tags: [console]
      summary: (Desktop-Konsole) Systemlast/Systeminfo
      x-rbac: operator
      responses:
        "200": { description: Systeminfo }

  /api/scan:
    post:
      tags: [discovery]
      summary: Netzwerk-Scan (Alias von /api/discovery/scan, Operations-Center)
      x-rbac: service
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                subnet: { type: string, example: "192.168.1.0/24" }
      responses:
        "200":
          description: Scan-Ergebnis (devices, scanned, subnet)
        "403": { $ref: "#/components/responses/JsonError" }

  /api/discovery/scan:
    get:
      tags: [discovery]
      summary: Discovery-Scan (mDNS/SSDP/ARP, optional Netz-Scan)
      x-rbac: service
      parameters:
        - name: subnet
          in: query
          schema: { type: string, example: "192.168.1.0/24" }
        - name: deep
          in: query
          schema: { type: string, enum: ["0", "1"] }
      responses:
        "200":
          description: "{ devices, scanned, subnet }"
        "403": { $ref: "#/components/responses/JsonError" }

  /api/scripts/run:
    post:
      tags: [ops]
      summary: Whitelist-Skript ausführen (Exit-Code im Audit)
      description: |
        Ausgeführt wird nur, was in `server/data/scripts/manifest.json` steht
        (A-1). `kind: script` läuft als Subprocess mit argv-Liste (nie
        `shell=True`), Timeout und Ausgabe-Cap; der SHA-256-Pin wird vor dem
        Start geprüft. `kind: builtin` läuft im Prozess, weil der Schritt den
        Geräte-Store braucht (`network_scan.py`).

        Ablehnungen sind ehrlich: nicht whitelisted → **501** (mit
        `whitelist[]`), fremdes/unpassendes Argument → **400**, Pin-Abweichung
        oder fehlender Interpreter → **409**. Ein Lauf mit Exit-Code ≠ 0
        antwortet 200 mit `ok: false` und dem echten Exit-Code.
      x-rbac: service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                script: { type: string, example: disk_report.py }
                name: { type: string, description: "Alias für script (Operations-Center)" }
                args:
                  description: "Objekt ({path: '/'}) ODER CLI-String ('--subnet 10.0.0.0/24')"
                  oneOf:
                    - type: object
                    - type: string
                subnet: { type: string, description: "Kurzform für network_scan.py" }
      responses:
        "200":
          description: "{ ok, script, kind, exitCode, output, error, durationMs, truncated, argv, reason }"
        "400": { $ref: "#/components/responses/JsonError" }
        "403": { $ref: "#/components/responses/JsonError" }
        "409": { $ref: "#/components/responses/JsonError" }
        "501":
          description: Skript steht nicht auf der Whitelist (mit `whitelist[]`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/JsonError" }

  /api/diagnostics/iperf:
    get:
      tags: [diagnostics]
      summary: Durchsatz-Selbsttest (HTTP-Loopback, Ziel local-mesh)
      x-rbac: operator
      responses:
        "200":
          description: "{ target, throughputMbps, packets, durationMs, status, tool }"
        "403": { $ref: "#/components/responses/JsonError" }

  /api/diag/ping:
    get:
      tags: [diagnostics]
      summary: Ping-/Latenzmessung gegen Ziel-Liste
      x-rbac: operator
      parameters:
        - name: targets
          in: query
          description: Kommaseparierte Ziele (leer ⇒ Default-Gateway, 1.1.1.1, 8.8.8.8)
          schema: { type: string }
      responses:
        "200": { description: "{ results: [{target, ok, latencyMs, status}] }" }
        "403": { $ref: "#/components/responses/JsonError" }
    post:
      tags: [diagnostics]
      summary: Ping mit Ziel-Liste im Body
      x-rbac: operator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                targets:
                  type: array
                  items: { type: string }
      responses:
        "200": { description: "{ results: [...] }" }

  /api/diag/payload:
    get:
      tags: [diagnostics]
      summary: Download-Payload für Durchsatzmessung im Browser
      x-rbac: guest
      parameters:
        - name: bytes
          in: query
          schema: { type: integer, default: 1048576, maximum: 8388608 }
      responses:
        "200":
          description: application/octet-stream
          content:
            application/octet-stream:
              schema: { type: string, format: binary }

  /api/diag/throughput:
    get:
      tags: [diagnostics]
      summary: Lokaler Durchsatz-Selbsttest (Kopier-Untergrenze)
      x-rbac: operator
      responses:
        "200": { description: "{ target, bytes, durationMs, throughputMbps, packets, status }" }

  /api/research:
    get:
      tags: [ops]
      summary: Recherche-Aggregation (konfigurierte Quellen)
      x-rbac: operator
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: sources
          in: query
          schema: { type: string, description: kommasepariert }
      responses:
        "200": { description: Recherche-Ergebnis }
        "400": { $ref: "#/components/responses/JsonError" }
        "502": { $ref: "#/components/responses/JsonError" }

  /api/rosetta:
    post:
      tags: [ops]
      summary: Rosetta-AI-Gateway (lokale Route mit Geräte-/Lastkontext)
      x-rbac: operator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                route: { type: string, example: net-analysis }
      responses:
        "200": { description: "{ route, backendId, result }" }

  /api/nodes/validate:
    get:
      tags: [ops]
      summary: Enterprise-Knoten serverseitig proben (oder Backend-Selbstprüfung)
      description: |
        Ohne `node=` unveränderte Selbstprüfung des eigenen Backends. Mit
        `node=<kategorie|knoten-id>` wird der Knoten aus
        `config/enterprise-nodes.csv` echt geprobt (HEAD, bei 405/501
        GET-Fallback, hartes Timeout), mit `node=all` der gesamte Bestand (A-10).

        Ehrlicher Befund statt erfundenem Erfolg: `reason` ist eines von
        `http-ok`, `http-error`, `network-error`, `timeout`,
        `unsupported-scheme`, `unknown-node`. Solange Planungs-Hosts
        (`*.qloud.local`) konfiguriert sind, ist `network-error` erwartbar
        (GAP-Matrix G-1).
      x-rbac: operator
      parameters:
        - name: node
          in: query
          description: "Kategorie (z. B. `API`, `2. API`), Knoten-ID oder `all`"
          schema: { type: string, example: API }
        - name: timeout
          in: query
          description: "Probe-Timeout in Sekunden (0.5–30, Default 4)"
          schema: { type: number, default: 4 }
      responses:
        "200":
          description: "Selbstprüfung `{ ok, scope: self, endpoint, devices, nodesInConfig, hint }` · Einzelknoten `{ ok, scope: node, node, nodeId, endpoint, probeUrl, status, reason, reasonLabel, latencyMs, error? }` · Bestand `{ ok, scope: all, reachable, total, nodes[] }`"
        "400": { $ref: "#/components/responses/JsonError" }
        "403": { $ref: "#/components/responses/JsonError" }

  /metrics:
    get:
      tags: [console]
      summary: Prometheus-Metriken (Textformat)
      x-rbac: guest
      responses:
        "200":
          description: Metriken im Prometheus-Textformat
          content:
            text/plain:
              schema: { type: string }


components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    DeviceId:
      name: id
      in: path
      required: true
      schema: { type: string }
    WebAuthnToken:
      name: X-WebAuthn-Token
      in: header
      required: true
      description: Einmal-Grant aus /api/webauthn/assert (Replay-geschützt)
      schema: { type: string }

  responses:
    JsonError:
      description: Strukturierter Fehler (keine Interna)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Role:
      type: string
      enum: [guest, operator, service, developer, expert, emergency]

    Error:
      type: object
      properties:
        type: { type: string, example: error }
        code:
          type: string
          example: RBAC_DENIED
          description: u. a. RBAC_DENIED, DONGLE_MISSING, TERMINAL_SESSION_TIMEOUT
        message: { type: string }

    Device:
      type: object
      properties:
        id: { type: string }
        kind:
          type: string
          enum: [hardware, dongle, ble_token, ntag, network]
        label: { type: string }
        online: { type: boolean }
        autoBindable: { type: boolean }
        usbVendorId: { type: string, example: "0x2341" }
        usbProductId: { type: string }
        signal:
          type: object
          properties:
            rssi: { type: integer }
        permissions:
          type: object
          additionalProperties:
            type: array
            items: { type: string, enum: [read, write, update, delete] }

    Pairing:
      type: object
      properties:
        pid: { type: string }
        name: { type: string }
        deviceIds:
          type: array
          items: { type: string }
        lastSync: { type: string, format: date-time }

    Client:
      type: object
      properties:
        id: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        device: { type: string }
        mode: { type: string, enum: [client, server] }
        online: { type: boolean }
        lastSeen: { type: string, format: date-time }

    AuditEntry:
      type: object
      properties:
        ts: { type: string, format: date-time }
        trace_id: { type: string }
        step:
          type: string
          example: device.bind
          description: "Kette: trace.start → auth.login → device.bind …"
        actor_role: { $ref: "#/components/schemas/Role" }
        outcome: { type: string, enum: [ok, denied, error] }

security:
  - bearerAuth: []
